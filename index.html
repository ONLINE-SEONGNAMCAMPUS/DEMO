<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>온라인 을지대 방명록</title>
<style>
  :root{
    --bg:#fff; --ink:#1b2a41; --accent:#2f6df6; --soft:rgba(255,255,255,.92);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe3ff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;color:var(--ink);touch-action:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* intro */
  #intro{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(180deg,#9fd3ff,#e9f6ff 60%,#d8f0c8)}
  .card{width:100%;max-width:380px;background:var(--soft);border-radius:24px;padding:26px 22px;box-shadow:0 12px 40px rgba(30,60,120,.18)}
  .card h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
  .card p{margin:0 0 18px;font-size:14px;color:#52627d;line-height:1.5}
  .card label{display:block;font-size:12px;font-weight:600;margin:14px 0 6px;color:#52627d}
  input[type=text],textarea{-webkit-user-select:text;user-select:text;width:100%;border:1.5px solid #d5deee;border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;outline:none}
  input[type=text]:focus,textarea:focus{border-color:var(--accent)}
  .colors{display:flex;gap:10px;flex-wrap:wrap}
  .colors button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0;cursor:pointer}
  .colors button.on{border-color:var(--ink);transform:scale(1.1)}
  .btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--accent);color:#fff;margin-top:20px;cursor:pointer}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#eaf0fb;color:var(--ink);margin-top:8px}

  /* hud */
  #hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
  #topbar{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
  .pill{background:var(--soft);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(30,60,120,.15)}
  #stick{position:absolute;left:24px;bottom:calc(env(safe-area-inset-bottom) + 36px);width:128px;height:128px;border-radius:50%;
    background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.7);pointer-events:auto;backdrop-filter:blur(4px)}
  #knob{position:absolute;left:34px;top:34px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 12px rgba(0,0,0,.2)}
  #actions{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 40px);display:flex;flex-direction:column;gap:12px;align-items:flex-end;pointer-events:auto}
  .fab{border:0;border-radius:999px;background:var(--soft);padding:0 18px;height:52px;font-size:15px;font-weight:700;color:var(--ink);box-shadow:0 6px 18px rgba(30,60,120,.2);cursor:pointer}
  .fab.main{background:var(--accent);color:#fff;height:58px;font-size:16px}
  .fab:active{transform:scale(.96)}
  #hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 190px);transform:translateX(-50%);
    max-width:86%;background:rgba(27,42,65,.88);color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;line-height:1.45;text-align:center;
    opacity:0;transition:opacity .2s;pointer-events:none}
  #hint.show{opacity:1}
  #hint b{display:block;font-size:12px;opacity:.7;margin-bottom:2px;font-weight:600}

  /* write sheet */
  #sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(10,20,40,.4)}
  #sheet .card{border-radius:24px 24px 0 0;max-width:480px;padding-bottom:calc(env(safe-area-inset-bottom) + 22px)}
  textarea{height:110px;resize:none}
  .count{text-align:right;font-size:12px;color:#8190aa;margin-top:4px}
  .notes{display:flex;gap:8px;margin-top:10px}
  .notes button{width:30px;height:30px;border-radius:8px;border:3px solid transparent;cursor:pointer;padding:0}
  .notes button.on{border-color:var(--ink)}
  #toast{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translate(-50%,-20px);z-index:40;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="intro">
  <div class="card">
    <h1>🏫 온라인 을지대</h1>
    <p>전공학술제 방명록 — 캠퍼스를 돌아다니며 응원의 한마디를 남겨보세요.</p>
    <label>닉네임</label>
    <input id="nick" type="text" maxlength="8" placeholder="최대 8자" autocomplete="off">
    <label>캐릭터 색</label>
    <div class="colors" id="colors"></div>
    <button class="btn" id="enter">입장하기</button>
  </div>
</div>

<div id="hud">
  <div id="topbar">
    <div class="pill">🏫 을지대 전공학술제</div>
    <div class="pill" id="count">💌 0</div>
  </div>
  <div id="hint"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="actions">
    <button class="fab" id="hello">👋 인사</button>
    <button class="fab main" id="write">✍️ 방명록 쓰기</button>
  </div>
</div>

<div id="sheet">
  <div class="card">
    <h1 style="font-size:18px;margin:0 0 12px">방명록 남기기</h1>
    <textarea id="msg" maxlength="60" placeholder="학술제를 응원하는 한마디를 적어주세요"></textarea>
    <div class="count"><span id="len">0</span>/60</div>
    <label style="margin-top:6px">쪽지 색</label>
    <div class="notes" id="noteColors"></div>
    <button class="btn" id="post">캠퍼스에 꽂기 📌</button>
    <button class="btn ghost" id="cancel">닫기</button>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

/* ================= 설정 / 저장소 ================= */
const STORE_KEY = 'eulji-guestbook-v1';
const PALETTE = ['#ff6b6b','#ffa94d','#ffd43b','#51cf66','#339af0','#845ef7','#f783ac','#495057'];
const NOTE_COLORS = ['#fff3a3','#ffd6e0','#c9f0ff','#d3f9d8','#e5dbff'];
const SEED = [
  ['학술제 화이팅!','을지대 22학번'],
  ['준비하느라 고생 많았어요 👏','선배'],
  ['작품 너무 멋져요!','교수님'],
  ['여기 3D 신기하다ㅋㅋ','방문자'],
];

const $ = id => document.getElementById(id);
const loadNotes = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || null; } catch(e){ return null; } };
const saveNotes = list => { try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch(e){} };
let notes = loadNotes();
if (!notes) {
  notes = SEED.map((s,i)=>({ id:'seed'+i, text:s[0], nick:s[1], color:NOTE_COLORS[i%NOTE_COLORS.length], t:Date.now()-i*1000 }));
  saveNotes(notes);
}

/* ================= 인트로 ================= */
let myColor = PALETTE[4];
PALETTE.forEach((c,i)=>{
  const b=document.createElement('button'); b.style.background=c; if(c===myColor) b.classList.add('on');
  b.onclick=()=>{ myColor=c; [...$('colors').children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
  $('colors').appendChild(b);
});
let noteColor = NOTE_COLORS[0];
NOTE_COLORS.forEach(c=>{
  const b=document.createElement('button'); b.style.background=c; b.style.boxShadow='inset 0 0 0 1px rgba(0,0,0,.12)';
  if(c===noteColor) b.classList.add('on');
  b.onclick=()=>{ noteColor=c; [...$('noteColors').children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
  $('noteColors').appendChild(b);
});
$('nick').value = (()=>{ try{return localStorage.getItem('eulji-nick')||'';}catch(e){return '';} })();

/* ================= three.js 기본 ================= */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const SKY = 0xbfe3ff;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 40, 110);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0x9bc57a, 0.85));
const sun = new THREE.DirectionalLight(0xfff2d6, 0.9);
sun.position.set(25, 40, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera, {left:-35,right:35,top:35,bottom:-35,near:1,far:120});
scene.add(sun);

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.fov = w/h < 1 ? 66 : 55;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

const mat = (c, o={}) => new THREE.MeshLambertMaterial(Object.assign({color:c}, o));
function box(w,h,d,c,x,y,z,parent=scene,cast=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c));
  m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=true; parent.add(m); return m;
}

/* ================= 월드: 캠퍼스 ================= */
const WORLD = 42;           // 이동 가능 반경(정사각 반폭)
const colliders = [];       // {x,z,r} 원형 / {minX,maxX,minZ,maxZ} 사각

// 잔디
const ground = new THREE.Mesh(new THREE.PlaneGeometry(240,240), mat(0x8fd16b));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
// 바깥 땅
const outer = new THREE.Mesh(new THREE.RingGeometry(WORLD+6, 200, 4, 1, Math.PI/4), mat(0x6fb04f));
outer.rotation.x=-Math.PI/2; outer.position.y=0.02; scene.add(outer);

// 중앙 광장
const plaza = new THREE.Mesh(new THREE.CircleGeometry(15,48), mat(0xf1e4cc));
plaza.rotation.x=-Math.PI/2; plaza.position.y=0.03; plaza.receiveShadow=true; scene.add(plaza);
const ring = new THREE.Mesh(new THREE.RingGeometry(14.2,15,48), mat(0xd9c29a));
ring.rotation.x=-Math.PI/2; ring.position.y=0.04; scene.add(ring);

// 길 (광장 → 본관)
const road = new THREE.Mesh(new THREE.PlaneGeometry(7, 40), mat(0xe8dcc3));
road.rotation.x=-Math.PI/2; road.position.set(0,0.035,-32); road.receiveShadow=true; scene.add(road);
const road2 = road.clone(); road2.position.set(0,0.035,32); scene.add(road2);

// 본관
function makeSignTexture(lines, w=1024, h=256, bg='#1d3b8b', fg='#fff'){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
  g.fillStyle=bg; g.fillRect(0,0,w,h);
  g.fillStyle=fg; g.textAlign='center'; g.textBaseline='middle';
  lines.forEach((l,i)=>{
    g.font = `800 ${l.size}px -apple-system,"Apple SD Gothic Neo",sans-serif`;
    g.fillText(l.t, w/2, l.y);
  });
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}
const main = new THREE.Group(); main.position.set(0,0,-40); scene.add(main);
box(34,16,12,0xf4efe6,0,8,0,main);
box(34,1.2,13,0x3b4a7a,0,16.4,0,main);
box(8,10,3,0xe3dccd,0,5,6.6,main);               // 현관
box(9,1,4,0x3b4a7a,0,10.4,6.6,main);
for(let r=0;r<2;r++) for(let i=-6;i<=6;i++){
  if (r===0 && Math.abs(i)<2) continue;
  box(1.6,2.4,.2,0x8fc8ff,i*2.4,5+r*6,6.05,main,false);
}
const sign = new THREE.Mesh(new THREE.PlaneGeometry(14,3.5), new THREE.MeshBasicMaterial({
  map: makeSignTexture([{t:'EULJI UNIVERSITY',size:60,y:80},{t:'을지대학교 전공학술제',size:90,y:175}])
}));
sign.position.set(0,13.4,6.12); main.add(sign);
colliders.push({minX:-17.5,maxX:17.5,minZ:-47,maxZ:-33});

// 양옆 건물
function wing(x,z,c,w,d,h){
  box(w,h,d,c,x,h/2,z);
  for(let i=0;i<Math.floor(h/4);i++) for(let j=-Math.floor(w/5);j<=Math.floor(w/5);j++){
    box(1.6,2,.2,0x8fc8ff,x+j*3,2.6+i*4,z+d/2+.05,scene,false);
  }
  colliders.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2});
}
wing(-30,-18,0xf7e3c4,14,10,12);
wing(30,-18,0xd7e8f7,14,10,12);

// 나무
function tree(x,z,s=1){
  const g=new THREE.Group(); g.position.set(x,0,z); g.scale.setScalar(s);
  box(.6,2.4,.6,0x8b5a2b,0,1.2,0,g);
  const l=new THREE.Mesh(new THREE.IcosahedronGeometry(2,0), mat(0x3fa34d));
  l.position.y=4; l.castShadow=true; g.add(l);
  const l2=new THREE.Mesh(new THREE.IcosahedronGeometry(1.4,0), mat(0x58bd5f));
  l2.position.set(.7,5.2,.2); l2.castShadow=true; g.add(l2);
  scene.add(g); colliders.push({x,z,r:.9*s});
}
let seed=7; const rnd=()=> (seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<46;i++){
  const a=rnd()*Math.PI*2, d=20+rnd()*22;
  const x=Math.cos(a)*d, z=Math.sin(a)*d;
  if (z < -26 && Math.abs(x)<22) continue;          // 본관 앞
  if (Math.abs(x)<5 && Math.abs(z)>14) continue;    // 길
  if (Math.abs(x)>WORLD-2||Math.abs(z)>WORLD-2) continue;
  tree(x,z,.8+rnd()*.7);
}

// 가로등
function lamp(x,z){
  box(.2,4,.2,0x444c5e,x,2,z);
  const b=new THREE.Mesh(new THREE.SphereGeometry(.45,12,12), new THREE.MeshBasicMaterial({color:0xfff2b0}));
  b.position.set(x,4.2,z); scene.add(b);
}
for(let i=0;i<10;i++){ const a=i/10*Math.PI*2; lamp(Math.cos(a)*13.5, Math.sin(a)*13.5); }

// 벤치
function bench(x,z,rot){
  const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rot;
  box(2.2,.2,.7,0xb5793c,0,.6,0,g); box(2.2,.6,.15,0xb5793c,0,1.05,-.3,g);
  box(.15,.6,.6,0x333,-.9,.3,0,g); box(.15,.6,.6,0x333,.9,.3,0,g); scene.add(g);
}
bench(-22,6,Math.PI/2); bench(22,6,-Math.PI/2); bench(-22,-4,Math.PI/2); bench(22,-4,-Math.PI/2);

// 중앙 방명록 기념비
const BOOK = new THREE.Vector3(0,0,0);
const monument = new THREE.Group(); scene.add(monument);
box(5,.5,5,0xcfd6e6,0,.25,0,monument);
box(4,.5,4,0xb9c3da,0,.75,0,monument);
const stele = box(3.2,4.2,.5,0x1d3b8b,0,3.1,0,monument);
const bookSign = new THREE.Mesh(new THREE.PlaneGeometry(3,3.6), new THREE.MeshBasicMaterial({
  map: makeSignTexture([{t:'📖',size:120,y:130},{t:'방명록',size:110,y:300},{t:'한마디 남기고 가세요',size:46,y:400}],512,600)
}));
bookSign.position.set(0,3.1,.27); monument.add(bookSign);
const bookSign2 = bookSign.clone(); bookSign2.rotation.y=Math.PI; bookSign2.position.z=-.27; monument.add(bookSign2);
colliders.push({x:0,z:0,r:2.9});

// 구름
for(let i=0;i<9;i++){
  const c=new THREE.Group();
  for(let j=0;j<4;j++){ const s=new THREE.Mesh(new THREE.SphereGeometry(2+rnd()*2,8,8), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9})); s.position.set(j*2.4,rnd()*1,rnd()*1.5); c.add(s); }
  c.position.set((rnd()-.5)*160, 28+rnd()*8, (rnd()-.5)*160); c.userData.v=.4+rnd()*.4; scene.add(c);
  (window._clouds ||= []).push(c);
}

/* ================= 방명록 쪽지 (월드에 꽂힘) ================= */
const noteGroup = new THREE.Group(); scene.add(noteGroup);
const noteMeshes = new Map();   // id -> group

function wrap(g, text, maxW){
  const out=[]; let line='';
  for (const ch of text){
    if (g.measureText(line+ch).width > maxW){ out.push(line); line=ch; } else line+=ch;
  }
  if (line) out.push(line);
  return out;
}
function noteTexture(n){
  const W=320,H=240, c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  g.fillStyle=n.color; g.fillRect(0,0,W,H);
  g.fillStyle='rgba(0,0,0,.07)'; g.fillRect(0,H-6,W,6);
  g.fillStyle='#e04b4b'; g.beginPath(); g.arc(W/2,18,9,0,7); g.fill();
  g.fillStyle='#1b2a41'; g.textAlign='left'; g.textBaseline='top';
  g.font='700 30px -apple-system,"Apple SD Gothic Neo",sans-serif';
  const lines=wrap(g,n.text,W-44).slice(0,4);
  lines.forEach((l,i)=>g.fillText(l+(i===3&&wrap(g,n.text,W-44).length>4?'…':''),22,40+i*36));
  g.textAlign='right'; g.font='600 22px -apple-system,"Apple SD Gothic Neo",sans-serif'; g.fillStyle='rgba(27,42,65,.6)';
  g.fillText('- '+n.nick, W-18, H-34);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}
function notePos(i){
  // 광장 주변 나선형 배치
  const ring = Math.floor(i/14), k = i%14;
  const r = 7.2 + ring*2.8;
  const a = (k/14)*Math.PI*2 + ring*0.45;
  return { x:Math.cos(a)*r, z:Math.sin(a)*r, a };
}
function addNoteMesh(n, i, pop=false){
  const p = notePos(i);
  const g = new THREE.Group(); g.position.set(p.x,0,p.z);
  g.rotation.y = Math.atan2(-p.x,-p.z);   // 중앙(기념비)을 바라봄 → 정면이 +z 이므로 보정
  g.rotation.y = Math.atan2(p.x, p.z) + Math.PI;
  box(.12,1.4,.12,0x8b6b3c,0,.7,0,g);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.8,1.35), new THREE.MeshBasicMaterial({map:noteTexture(n), side:THREE.DoubleSide}));
  m.position.set(0,1.95,.08); m.castShadow=true; g.add(m);
  const back = box(1.86,1.41,.05,0xffffff,0,1.95,.04,g); back.material.color.set(n.color);
  g.userData={n,pos:p};
  noteGroup.add(g); noteMeshes.set(n.id,g);
  if (pop){ g.scale.setScalar(.01); g.userData.pop=0; }
}
function rebuildNotes(){
  noteMeshes.forEach(g=>noteGroup.remove(g)); noteMeshes.clear();
  notes.slice(-80).forEach((n,i)=>addNoteMesh(n,i));
  $('count').textContent='💌 '+notes.length;
}

/* ================= 캐릭터 ================= */
function nameSprite(text, bg='rgba(27,42,65,.85)'){
  const c=document.createElement('canvas'); c.width=256; c.height=72; const g=c.getContext('2d');
  g.font='700 34px -apple-system,"Apple SD Gothic Neo",sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  const w=Math.min(240,g.measureText(text).width+36);
  g.fillStyle=bg; const x=128-w/2, r=24; g.beginPath(); g.moveTo(x+r,8); g.arcTo(x+w,8,x+w,64,r); g.arcTo(x+w,64,x,64,r); g.arcTo(x,64,x,8,r); g.arcTo(x,8,x+w,8,r); g.fill();
  g.fillStyle='#fff'; g.fillText(text,128,37);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));
  s.scale.set(2.4,.675,1); s.renderOrder=10; return s;
}
function bubbleSprite(text){
  const c=document.createElement('canvas'); c.width=384; c.height=140; const g=c.getContext('2d');
  g.font='700 30px -apple-system,"Apple SD Gothic Neo",sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='#fff'; g.strokeStyle='#1b2a41'; g.lineWidth=4;
  g.beginPath(); g.roundRect ? g.roundRect(8,8,368,96,28) : g.rect(8,8,368,96); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(180,102); g.lineTo(192,130); g.lineTo(206,102); g.fillStyle='#fff'; g.fill();
  g.fillStyle='#1b2a41';
  const t = text.length>14 ? text.slice(0,13)+'…' : text; g.fillText(t,192,57);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));
  s.scale.set(3.6,1.31,1); s.renderOrder=11; return s;
}
function makeCharacter(color, nick){
  const root=new THREE.Group();
  const body=new THREE.Group(); root.add(body);
  const skin=0xffd9b8;
  const torso=box(.9,1.0,.55,color,0,1.6,0,body);
  const head=new THREE.Mesh(new THREE.BoxGeometry(.85,.8,.8), mat(skin)); head.position.y=2.55; head.castShadow=true; body.add(head);
  const hair=box(.9,.3,.85,0x3a2a22,0,2.9,-.02,body);
  box(.12,.12,.05,0x222222,-.2,2.55,.41,body,false); box(.12,.12,.05,0x222222,.2,2.55,.41,body,false);
  const mk=(x)=>{ const g=new THREE.Group(); g.position.set(x,1.1,0); box(.32,1.0,.35,0x35435f,0,-.5,0,g); body.add(g); return g; };
  const legL=mk(-.23), legR=mk(.23);
  const mkA=(x)=>{ const g=new THREE.Group(); g.position.set(x,2.0,0); box(.26,.9,.28,color,0,-.4,0,g); box(.26,.25,.28,skin,0,-.95,0,g); body.add(g); return g; };
  const armL=mkA(-.6), armR=mkA(.6);
  const label=nameSprite(nick); label.position.y=3.65; root.add(label);
  return {root,body,legL,legR,armL,armR,label,bubble:null,bubbleT:0};
}

let me=null;
const player={ pos:new THREE.Vector3(0,0,12), vel:new THREE.Vector3(), yaw:Math.PI, walk:0, hop:0, hello:0 };
const cam={ yaw:0, pitch:.42, dist:10 };
cam.yaw = 0;

function say(ch, text, secs=5){
  if (ch.bubble){ ch.root.remove(ch.bubble); }
  ch.bubble = bubbleSprite(text); ch.bubble.position.y=4.9; ch.root.add(ch.bubble); ch.bubbleT=secs;
}

/* NPC 방문자 (분위기용) */
const npcs=[];
['동기','후배','선배','교수님','친구'].forEach((name,i)=>{
  const ch=makeCharacter(new THREE.Color(PALETTE[(i*2+1)%PALETTE.length]), name);
  const a=Math.random()*6.28; ch.root.position.set(Math.cos(a)*10,0,Math.sin(a)*10);
  ch.t=Math.random()*10; ch.target=new THREE.Vector3(ch.root.position.x,0,ch.root.position.z); ch.wait=Math.random()*3;
  scene.add(ch.root); npcs.push(ch);
});
const NPC_LINES=['학술제 화이팅!','여기 재밌다 ㅎㅎ','방명록 써야지','작품 구경가자','사진 찍자 📸','배고프다…'];

/* ================= 입력 ================= */
const input={x:0,y:0};         // 조이스틱 (x:좌우, y:앞뒤 -1=앞)
const keys={};
addEventListener('keydown',e=>{ if(document.activeElement.tagName==='TEXTAREA'||document.activeElement.tagName==='INPUT') return; keys[e.code]=true; if(e.code==='KeyE') openWrite(); if(e.code==='Space') doHello(); });
addEventListener('keyup',e=>keys[e.code]=false);

const stick=$('stick'), knob=$('knob'); let stickId=null;
function stickMove(e){
  const r=stick.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy; const max=r.width/2-8, len=Math.hypot(dx,dy);
  if(len>max){ dx*=max/len; dy*=max/len; }
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  input.x=dx/max; input.y=dy/max;
}
function stickEnd(){ stickId=null; knob.style.transform=''; input.x=input.y=0; }
stick.addEventListener('pointerdown',e=>{ stickId=e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); e.preventDefault(); });
stick.addEventListener('pointermove',e=>{ if(e.pointerId===stickId) stickMove(e); });
stick.addEventListener('pointerup',e=>{ if(e.pointerId===stickId) stickEnd(); });
stick.addEventListener('pointercancel',stickEnd);

// 화면 드래그 → 카메라 회전, 핀치 → 줌
let camPtr=null, lastX=0, lastY=0; const pts=new Map(); let pinch0=0, dist0=10;
canvas.addEventListener('pointerdown',e=>{ pts.set(e.pointerId,e); if(pts.size===1){camPtr=e.pointerId;lastX=e.clientX;lastY=e.clientY;} if(pts.size===2){ const [a,b]=[...pts.values()]; pinch0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); dist0=cam.dist; } });
canvas.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,e);
  if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); cam.dist=Math.max(5,Math.min(18,dist0*pinch0/d)); return; }
  if(e.pointerId===camPtr){ cam.yaw-=(e.clientX-lastX)*.006; cam.pitch=Math.max(.15,Math.min(1.1,cam.pitch+(e.clientY-lastY)*.004)); lastX=e.clientX; lastY=e.clientY; }
});
const endPtr=e=>{ pts.delete(e.pointerId); if(e.pointerId===camPtr) camPtr=null; };
canvas.addEventListener('pointerup',endPtr); canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{ cam.dist=Math.max(5,Math.min(18,cam.dist+e.deltaY*.01)); },{passive:true});

/* ================= UI 동작 ================= */
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }
function doHello(){ if(!me) return; player.hello=1.2; say(me,'안녕하세요! 👋',3); }
function openWrite(){ if(!me) return; $('sheet').style.display='flex'; setTimeout(()=>$('msg').focus(),50); }
function closeWrite(){ $('sheet').style.display='none'; $('msg').blur(); }
$('hello').onclick=doHello; $('write').onclick=openWrite; $('cancel').onclick=closeWrite;
$('msg').addEventListener('input',()=>$('len').textContent=$('msg').value.length);
$('sheet').addEventListener('pointerdown',e=>{ if(e.target===$('sheet')) closeWrite(); });
$('post').onclick=()=>{
  const text=$('msg').value.trim(); if(!text){ toast('내용을 입력해주세요'); return; }
  const n={ id:'n'+Date.now()+Math.random().toString(36).slice(2,5), text, nick:me.nick, color:noteColor, t:Date.now() };
  notes.push(n); saveNotes(notes);
  addNoteMesh(n, Math.min(notes.length,80)-1, true);
  if (notes.length>80) rebuildNotes();
  $('count').textContent='💌 '+notes.length;
  say(me,text,6); $('msg').value=''; $('len').textContent=0; closeWrite(); toast('방명록이 꽂혔어요 📌');
  // 쪽지 위치로 카메라 시선 유도 안함 (간단 데모)
};
$('enter').onclick=()=>{
  const nick=($('nick').value.trim()||'익명'+Math.floor(Math.random()*90+10)).slice(0,8);
  try{ localStorage.setItem('eulji-nick',nick); }catch(e){}
  me=makeCharacter(new THREE.Color(myColor),nick); me.nick=nick; me.root.position.copy(player.pos); scene.add(me.root);
  $('intro').style.display='none'; $('hud').style.display='block';
  say(me,'입장! 👋',3);
};

// 다른 탭에서 쪽지가 추가되면 동기화 (데모용)
addEventListener('storage',e=>{ if(e.key===STORE_KEY){ notes=loadNotes()||[]; rebuildNotes(); } });

rebuildNotes();

/* ================= 게임 루프 ================= */
function collide(p, radius=.5){
  p.x=Math.max(-WORLD,Math.min(WORLD,p.x)); p.z=Math.max(-WORLD,Math.min(WORLD,p.z));
  for(const c of colliders){
    if(c.r!==undefined){
      const dx=p.x-c.x, dz=p.z-c.z, d=Math.hypot(dx,dz), m=c.r+radius;
      if(d<m){ const k=d>0?m/d:1; p.x=c.x+dx*k; p.z=c.z+dz*k; if(d===0) p.x+=m; }
    } else {
      if(p.x>c.minX-radius&&p.x<c.maxX+radius&&p.z>c.minZ-radius&&p.z<c.maxZ+radius){
        const l=p.x-(c.minX-radius), r=(c.maxX+radius)-p.x, t=p.z-(c.minZ-radius), b=(c.maxZ+radius)-p.z;
        const m=Math.min(l,r,t,b);
        if(m===l) p.x=c.minX-radius; else if(m===r) p.x=c.maxX+radius; else if(m===t) p.z=c.minZ-radius; else p.z=c.maxZ+radius;
      }
    }
  }
}
function animateLimbs(ch, speed, t, hello=0){
  const s=Math.sin(t*10)*speed*.9;
  ch.legL.rotation.x=s; ch.legR.rotation.x=-s;
  ch.armL.rotation.x=-s*.8; ch.armR.rotation.x=s*.8;
  if(hello>0){ ch.armR.rotation.x=Math.PI; ch.armR.rotation.z=Math.sin(t*18)*.5; } else ch.armR.rotation.z=0;
}

const hint=$('hint');
const clock=new THREE.Clock(); let T=0;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05); T+=dt;

  // 구름
  (window._clouds||[]).forEach(c=>{ c.position.x+=c.userData.v*dt; if(c.position.x>100) c.position.x=-100; });

  // NPC
  npcs.forEach(n=>{
    n.wait-=dt;
    const p=n.root.position;
    const dx=n.target.x-p.x, dz=n.target.z-p.z, d=Math.hypot(dx,dz);
    if(d>.3){ const sp=2.2; p.x+=dx/d*sp*dt; p.z+=dz/d*sp*dt; n.root.rotation.y=Math.atan2(dx,dz); n.t+=dt; animateLimbs(n,1,n.t); collide(p); }
    else { animateLimbs(n,0,n.t);
      if(n.wait<=0){ const a=Math.random()*6.28, r=6+Math.random()*30; n.target.set(Math.cos(a)*r,0,Math.sin(a)*r); n.wait=2+Math.random()*4; if(Math.random()<.4) say(n,NPC_LINES[Math.floor(Math.random()*NPC_LINES.length)],3.5); }
    }
    if(n.bubble){ n.bubbleT-=dt; if(n.bubbleT<=0){ n.root.remove(n.bubble); n.bubble=null; } }
  });

  // 노트 팝 애니메이션
  noteMeshes.forEach(g=>{ if(g.userData.pop!==undefined && g.userData.pop<1){ g.userData.pop=Math.min(1,g.userData.pop+dt*2.2); const k=g.userData.pop; g.scale.setScalar(1+Math.sin(k*Math.PI)*.25*(1-k)+ (k-1)*0 ); if(k<.3) g.scale.setScalar(Math.max(.01,k/.3)); } });

  if (me){
    // 이동
    let ix=input.x, iy=input.y;
    if(keys.KeyA||keys.ArrowLeft) ix-=1; if(keys.KeyD||keys.ArrowRight) ix+=1;
    if(keys.KeyW||keys.ArrowUp) iy-=1; if(keys.KeyS||keys.ArrowDown) iy+=1;
    const mag=Math.min(1,Math.hypot(ix,iy));
    if(mag>.08){
      // 카메라 기준 방향
      const fx=-Math.sin(cam.yaw), fz=-Math.cos(cam.yaw);   // 카메라가 바라보는 방향
      const rx=Math.cos(cam.yaw), rz=-Math.sin(cam.yaw);
      let dx=fx*(-iy)+rx*ix, dz=fz*(-iy)+rz*ix; const l=Math.hypot(dx,dz); dx/=l; dz/=l;
      const sp=(mag>.85?7:4.5);
      player.pos.x+=dx*sp*dt*mag/Math.max(mag,.0001)*Math.min(1,mag*1.2); player.pos.z+=dz*sp*dt*mag/Math.max(mag,.0001)*Math.min(1,mag*1.2);
      const target=Math.atan2(dx,dz); let da=target-player.yaw; da=Math.atan2(Math.sin(da),Math.cos(da)); player.yaw+=da*Math.min(1,dt*12);
      player.walk+=dt;
      collide(player.pos);
    }
    player.hello=Math.max(0,player.hello-dt);
    animateLimbs(me, mag>.08?Math.min(1,mag*1.3):0, player.walk, player.hello);
    me.root.position.set(player.pos.x,0,player.pos.z);
    me.root.rotation.y=player.yaw;
    me.body.position.y = mag>.08 ? Math.abs(Math.sin(player.walk*10))*.08 : (player.hello>0?Math.abs(Math.sin(T*14))*.12:0);
    if(me.bubble){ me.bubbleT-=dt; if(me.bubbleT<=0){ me.root.remove(me.bubble); me.bubble=null; } }

    // 카메라
    const tx=player.pos.x, ty=2.2, tz=player.pos.z;
    const cx=tx+Math.sin(cam.yaw)*Math.cos(cam.pitch)*cam.dist, cy=ty+Math.sin(cam.pitch)*cam.dist, cz=tz+Math.cos(cam.yaw)*Math.cos(cam.pitch)*cam.dist;
    camera.position.lerp(new THREE.Vector3(cx,cy,cz), 1-Math.pow(.0005,dt));
    camera.lookAt(tx,ty,tz);

    // 근접 안내
    let near=null, nd=3.2;
    noteMeshes.forEach(g=>{ const d=Math.hypot(g.position.x-player.pos.x,g.position.z-player.pos.z); if(d<nd){ nd=d; near=g; } });
    if(near){ const n=near.userData.n; hint.innerHTML=`<b>${n.nick}님의 방명록</b>${n.text.replace(/</g,'&lt;')}`; hint.classList.add('show'); }
    else if(Math.hypot(player.pos.x,player.pos.z)<6){ hint.innerHTML='<b>방명록 기념비</b>“✍️ 방명록 쓰기”로 한마디를 남겨보세요'; hint.classList.add('show'); }
    else hint.classList.remove('show');
  } else {
    // 인트로 중 카메라 회전
    const a=T*.12; camera.position.set(Math.sin(a)*26,12,Math.cos(a)*26); camera.lookAt(0,3,0);
  }
  renderer.render(scene,camera);
}
frame();
})();
</script>
